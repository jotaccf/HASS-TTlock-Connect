name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Patch manifest and zip
        run: |
          # HA rejects manifest versions with a leading "v"; strip it from the tag.
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/v0.0.0/${version}/" custom_components/ttlock_connect/manifest.json
          cd custom_components/ttlock_connect/
          zip ../../ttlock_connect.zip -r ./

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./ttlock_connect.zip --clobber --repo "$GITHUB_REPOSITORY"
